<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24335b"><title>כוכב ההצלחה | Babylon.js Lab</title><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script></head><body><canvas id="screen"></canvas><script type="module">
import {interfaceLab,MODEL} from './common.js';
const ui=interfaceLab('Babylon.js');
try{
 const B=window.BABYLON;if(!B)throw Error('Babylon.js engine unavailable');
 const canvas=document.querySelector('#screen');
 const engine=new B.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:false,disableWebGL2Support:false});
 // Native physical pixels in quality mode; offer reduced scaling for slower iPhones.
 engine.setHardwareScalingLevel(1);
 const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.51,.72,.88,1);
 scene.ambientColor=new B.Color3(.3,.38,.55);
 // Side-by-side visual tuning: user can compare default vs vivid without altering animation.
 const imaging=scene.imageProcessingConfiguration;
 imaging.isEnabled=true;
 let vivid=true;
 let renderPipeline=null;
 function applyVisualStyle(){
  imaging.contrast=vivid?1.3:1.0;
  imaging.exposure=vivid?1.15:1.0;
  imaging.toneMappingEnabled=false;
  scene.clearColor=vivid?new B.Color4(.25,.64,.93,1):new B.Color4(.51,.72,.88,1);
  // A real resolution change, not just an image-processing slider.
  engine.setHardwareScalingLevel(vivid?1:Math.max(1,devicePixelRatio/1.25));
  if(renderPipeline){renderPipeline.samples=vivid?4:1;renderPipeline.fxaaEnabled=vivid;}
  scene.getMaterialByName('grass')?.diffuseColor.copyFromFloats(...(vivid?[.16,.74,.42]:[.29,.57,.48]));
  scene.getMaterialByName('stone')?.diffuseColor.copyFromFloats(...(vivid?[.43,.40,.94]:[.62,.56,.84]));
  scene.getMaterialByName('roof')?.diffuseColor.copyFromFloats(...(vivid?[.89,.29,.83]:[.71,.43,.81]));
  scene.getMaterialByName('gold')?.diffuseColor.copyFromFloats(...(vivid?[1,.76,.20]:[.95,.74,.34]));
 }
 const vividButton=document.createElement('button');
 document.querySelector('#actions').appendChild(vividButton);
 vividButton.onclick=()=>{vivid=!vivid;applyVisualStyle();vividButton.textContent=vivid?'🎨 איכות גבוהה · חדות מקורית':'🎨 מצב חיסכון · איכות רגילה'};

 const color=(r,g,b)=>new B.Color3(r,g,b);
 const mat=(name,r,g,b)=>{const m=new B.StandardMaterial(name,scene);m.diffuseColor=color(r,g,b);m.specularColor=color(.08,.08,.08);return m};
 const grass=mat('grass',.23,.66,.46),sand=mat('sand',.98,.78,.50),stone=mat('stone',.51,.49,.88),gold=mat('gold',1,.73,.24),roof=mat('roof',.77,.32,.83);
 const cylinder=(name,x,y,z,d,h,m)=>{const o=B.MeshBuilder.CreateCylinder(name,{diameter:d,height:h,tessellation:24},scene);o.position.set(x,y,z);o.material=m;return o};
 const box=(name,x,y,z,w,h,d,m)=>{const o=B.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);o.position.set(x,y,z);o.material=m;return o};
 const sphere=(name,x,y,z,d,m)=>{const o=B.MeshBuilder.CreateSphere(name,{diameter:d,segments:12},scene);o.position.set(x,y,z);o.material=m;return o};
 cylinder('floating-island',0,-.8,0,34,1.6,grass);box('main-road',0,.08,0,3,.13,24,sand);
 for(let i=0;i<14;i++){const a=i*2.4,r=9+(i%3)*2.3,x=Math.cos(a)*r,z=Math.sin(a)*r;cylinder('tree',x,1.25,z,.65,2.5,stone);sphere('leaf',x,3.3,z,2.7,grass);}
 for(let i=0;i<4;i++){const a=i*Math.PI/2,x=Math.cos(a)*8,z=Math.sin(a)*8;box('fantasy-house',x,1.8,z,4.5,3.6,3.6,stone);const t=cylinder('tower',x,4.6,z,4.1,2.4,roof);t.rotation.y=Math.PI/4;sphere('lamp',x,6,z,1.2,gold);}
 const sun=new B.DirectionalLight('sun',new B.Vector3(-.4,-.8,.4),scene);sun.intensity=1.85;
 const ambient=new B.HemisphericLight('sky',new B.Vector3(0,1,0),scene);ambient.intensity=.7;
 const camera=new B.FreeCamera('follow-camera',new B.Vector3(0,9,16),scene);camera.fov=.85;camera.minZ=.1;camera.maxZ=220;
 scene.activeCamera=camera;
 // Anti-aliasing and subtle bloom are enabled only for high-quality preview.
 try {
  renderPipeline=new B.DefaultRenderingPipeline('quality-lab',true,scene,[camera]);
  renderPipeline.fxaaEnabled=true;
  renderPipeline.samples=4;
  renderPipeline.bloomEnabled=true;
  renderPipeline.bloomThreshold=.86;
  renderPipeline.bloomWeight=.12;
  renderPipeline.bloomKernel=32;
 } catch(e) {console.warn('Optional postprocessing unavailable',e)}
 applyVisualStyle();
 vividButton.textContent='🎨 איכות גבוהה · חדות מקורית';
 const actor=new B.TransformNode('CONTROLLER_ORIGIN',scene),facing=new B.TransformNode('FACING_PIVOT',scene);
 facing.parent=actor;
 const marker=sphere('world-center-marker',0,.15,0,.3,gold);
 const root=MODEL.substring(0,MODEL.lastIndexOf('/')+1),file=MODEL.split('/').pop();
 const loaded=await B.SceneLoader.ImportMeshAsync('',root,file,scene);
 const meshSet=loaded.meshes.filter(m=>m.getTotalVertices?.()>0);
 if(!meshSet.length)throw Error('GLB loaded without visible meshes');
 const movingRoots=loaded.meshes.filter(m=>!m.parent);
 const fixed=new B.TransformNode('STABLE_VISUAL_OFFSET',scene);fixed.parent=facing;
 for(const m of movingRoots)m.parent=fixed;
 const bounds=()=>{
   let low=new B.Vector3(Infinity,Infinity,Infinity),high=new B.Vector3(-Infinity,-Infinity,-Infinity);
   for(const m of meshSet){m.computeWorldMatrix(true);const b=m.getBoundingInfo().boundingBox;low=B.Vector3.Minimize(low,b.minimumWorld);high=B.Vector3.Maximize(high,b.maximumWorld)}
   return {low,high};
 };
 const b=bounds(),h=b.high.y-b.low.y;
 if(h>.01&&Number.isFinite(h)){const scale=2.8/h;fixed.scaling.set(scale,scale,scale);fixed.position.set(-(b.high.x+b.low.x)/2*scale,-b.low.y*scale,-(b.high.z+b.low.z)/2*scale);}
 const clips=loaded.animationGroups||[];
 for(const c of clips)c.stop();
 ui.status('✓ מודל נטען | '+clips.length+' אנימציות | השוו צבעוניות חדה/רגילה ו-FPS');
 let active=null;
 let follow=new B.Vector3(0,9,16);
 engine.runRenderLoop(()=>{
   const dt=Math.min(.05,Math.max(.001,engine.getDeltaTime()/1000));
   const s=ui.step(dt);
   // Babylon's handedness and camera view are opposite to the demo input's
   // expected screen-right vector. Mirror horizontal movement and heading.
   const px=-s.x,pz=s.z;
   actor.position.set(px,0,pz);
   facing.rotation.y=-s.yaw;
   marker.position.set(px,.15,pz);
   if(s.animation&&clips.length){
    const key=s.walking?'walk':'idle';
    const next=clips.find(c=>new RegExp(key==='walk'?'walk|run':'idle','i').test(c.name))||clips[0];
    if(active!==next){if(active)active.stop();active=next;active.start(true,1,active.from,active.to,false);}
   }else if(active){active.stop();active=null;}
   // Raw skeleton/root animation is intentionally retained in this optional test mode to reveal drift.
   const t=new B.Vector3(px,9,pz+16);
   follow=B.Vector3.Lerp(follow,t,1-Math.exp(-dt*5));
   camera.position.copyFrom(follow);camera.setTarget(new B.Vector3(px,1.4,pz));
   scene.render();
 });
 window.addEventListener('resize',()=>engine.resize());
}catch(error){console.error(error);ui.error('Babylon.js: '+String(error.message||error))}
</script></body></html>
