const quizDecks={};function nextQuestion(who,type){const id=who+':'+type;let deck=quizDecks[id];if(!deck||deck.length===0){let prior=quizDecks[id+'-last'];deck=questionBank[who][type].map((_,i)=>i);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}if(deck.length>1&&deck[deck.length-1]===prior){let k=deck.findIndex(x=>x!==prior);[deck[k],deck[deck.length-1]]=[deck[deck.length-1],deck[k]]}quizDecks[id]=deck;}let index=deck.pop();quizDecks[id+'-last']=index;return questionBank[who][type][index]}function update(){coins=Math.max(0,coins);level=1+Math.floor(xp/80);$('#coins').textContent=coins;$('#xp').textContent=xp;$('#level').textContent=level;localStorage.setItem('sp-alpha-'+profile,JSON.stringify({coins,xp,color,owned:save.owned||[]}))}function toast(s){let e=$('#tip');e.textContent=s;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2500)}function open(title,body){clearPad();$('#modalContent').innerHTML='<h2>'+title+'</h2>'+body;$('#backdrop').classList.add('open');keys.clear()}function close(){$('#backdrop').classList.remove('open')}$('#close').onclick=close;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')close()});

function animate(t){requestAnimationFrame(animate);if(padPointers.size && performance.now()-padLast>12000)clearPad();let dt=Math.min((t-last)/1000,.05);last=t;let vx=0,vz=0;if(!$('#welcome').classList.contains('hidden')||$('#backdrop').classList.contains('open'))keys.clear();if(keys.has('left'))vx-=1;if(keys.has('right'))vx+=1;if(keys.has('up'))vz-=1;if(keys.has('down'))vz+=1;let mag=Math.hypot(vx,vz);if(mag){vx/=mag;vz/=mag;let nx=avatar.position.x+vx*7.7*dt,nz=avatar.position.z+vz*7.7*dt;if(Math.hypot(nx,nz)<26){avatar.position.x=nx;avatar.position.z=nz}avatar.rotation.y=Math.atan2(vx,vz);walking+=dt*13;leftLeg.rotation.x=Math.sin(walking)*.5;rightLeg.rotation.x=-Math.sin(walking)*.5;leftArm.rotation.x=-Math.sin(walking)*.38;rightArm.rotation.x=Math.sin(walking)*.38}else{leftLeg.rotation.x*=.83;rightLeg.rotation.x*=.83;leftArm.rotation.x*=.83;rightArm.rotation.x*=.83}body.position.y=mag?Math.abs(Math.sin(walking))*.09:Math.sin(t*.002)*.06;let target=avatar.position.clone().add(new THREE.Vector3(0,12,18));camera.position.lerp(target,.055);camera.lookAt(avatar.position.x,2,avatar.position.z-1);starRing.rotation.y+=dt*.33;for(const fx of worldEffects){if(fx.kind==='orb')fx.g.position.y=fx.y+Math.sin(t*.0014+fx.i)*.23;else if(fx.kind==='lantern')fx.g.material.opacity=.11+.045*Math.sin(t*.002+fx.i);else fx.g.position.y=fx.y+Math.sin(t*.0004+fx.i)*.15}for(let i=0;i<clouds.length;i++)clouds[i].position.x+=dt*(.12+i%3*.05);near=null;let dist=5.7;for(let b of buildings){let d=Math.hypot(avatar.position.x-b.x,avatar.position.z-b.z);if(d<dist){near=b;dist=d}}if(near){$('#interact').innerText=near.icon+' '+near.name;$('#interact').style.opacity=1}else{$('#interact').innerText='✨ פעולה';$('#interact').style.opacity=.7}renderer.render(scene,camera)}camera.position.set(0,12,25);camera.lookAt(0,0,0);requestAnimationFrame(animate);$('#loading').classList.add('hidden');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSi
