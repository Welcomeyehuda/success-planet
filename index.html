      button.classList.add('answer-correct');
      $('#feedback').innerHTML='<div class="notice">🎉 כל הכבוד! +10 מטבעות ו־10 XP</div><button class="primary" id="nextQuest">'+(st.done===st.total?'לקבלת פרס הסיום ✨':'לשאלה הבאה ←')+'</button>';
      $('#nextQuest').onclick=()=>st.done===st.total?finishStage():showStageQuestion();
    }else{
      button.classList.add('answer-wrong');
      button.disabled=true;
      $('#feedback').innerHTML='<div class="notice" style="background:#fff1d6;color:#86571b">💡 כמעט! נסו תשובה אחרת. לא מאבדים נקודות.</div>';
    }
  });
}
function finishStage(){
  stopSpeech();const st=currentStage;if(!st)return;
  const bonus=30;coins+=bonus;xp+=bonus;update();
  open('🏆 משימה הושלמה!',`
    <div class="quest-victory">🌟🏆🌟</div>
    <h2 class="quest-win">כל חמשת האתגרים הושלמו!</h2>
    <div class="quest-summary"><div><strong>${st.correct}/${st.total}</strong><small>שאלות</small></div><div><strong>+${st.correct*10+bonus}</strong><small>מטבעות</small></div><div><strong>+${st.correct*10+bonus}</strong><small>XP</small></div></div>
    <p>כל הכבוד! צעד נוסף בדרך לפיתוח כוכב ההצלחה שלך.</p>
    <button class="primary" id="anotherQuest">🚀 עוד סבב</button>
    <button class="quest-exit" id="endQuest">🏡 חזרה לעולם</button>`);
  $('#anotherQuest').onclick=()=>quiz(st.type);
  $('#endQuest').onclick=()=>{currentStage=null;close()};
}

function interact(){if(!near){toast('התקרבו למבנה וחפשו את שם המקום ✨');return}if(near.type==='shop')shop();else if(near.type==='home')home();else quiz(near.type)}$('#interact').onclick=interact;$('#help').onclick=()=>open('🧭 איך משחקים?','<p>הזיזו את הדמות בעזרת החצים בתחתית המסך. במחשב אפשר להשתמש גם בחצי המקלדת או במקשי WASD.</p><div class="notice">🏠 הבית: אזור אישי · 🛍️ החנות: שדרוגים · ✨ השערים: אתגרי למידה. התקרבו למבנה ולחצו פעולה.</div><p class="small">זוהי הדגמה גרפית ומשחקית בלבד. אין משתמשים אמיתיים, דוחות הורים או סנכרון בענן. יש צורך בחיבור אינטרנט לטעינת מנוע התלת־ממד.</p>');
const padPointers=new Map();let padLast=performance.now();
function clearPad(){for(const direction of padPointers.values())keys.delete(direction);padPointers.clear()}
function releasePad(id){const dir=padPointers.get(id);if(dir){padPointers.delete(id);if(![...padPointers.values()].includes(dir))keys.delete(dir)}}
for(const el of document.querySelectorAll('[data-dir]')){
  const dir=el.dataset.dir;
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('dragstart',e=>e.preventDefault());
  el.addEventListener('selectstart',e=>e.preventDefault());
  el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  el.addEventListener('pointerdown',e=>{e.preventDefault();clearPad();padPointers.set(e.pointerId,dir);keys.add(dir);padLast=performance.now();try{el.setPointerCapture(e.pointerId)}catch{}});
  for(const ev of ['pointerup','pointercancel','lostpointercapture','pointerleave']) el.addEventListener(ev,e=>releasePad(e.pointerId));
}
for(const ev of ['pointerup','pointercancel']) window.addEventListener(ev,e=>releasePad(e.pointerId),{capture:true});
window.addEventListener('touchend',()=>clearPad(),{passive:true});
window.addEventListener('touchcancel',()=>clearPad(),{passive:true});
window.addEventListener('contextmenu',e=>{if(e.target.closest?.('.pad'))e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearPad();keys.clear()}});
window.addEventListener('pagehide',()=>{clearPad();keys.clear()});
const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};addEventListener('keydown',e=>{if(keyMap[e.key]){e.preventDefault();keys.add(keyMap[e.key])}if(e.key==='Escape')close();if(e.key===' '&&!$('#backdrop').classList.contains('open'))interact()});addEventListener('keyup',e=>{if(keyMap[e.key])keys.delete(keyMap[e.key])});addEventListener('blur',()=>keys.clear());
for(let b of document.querySelectorAll('[data-profile]'))b.onclick=()=>{profile=b.dataset.profile;document.querySelectorAll('[data-profile]').forEach(x=>x.classList.toggle('active',x===b))};$('#start').onclick=()=>{let s;try{s=JSON.parse(localStorage.getItem('sp-alpha-'+profile)||'{}')}catch{s={}}save=s;coins=s.coins??120;xp=s.xp??0;color=s.color??(profile==='adel'?'pink':'blue');applyCharacter(profile);setColor(color);for(let id of s.owned||[])spawnItem(id);$('#welcome').classList.add('hidden');update();toast('ברוכים הבאים לכוכב ההצלחה! ⭐')};
function animate(t){requestAnimationFrame(animate);if(padPointers.size && performance.now()-padLast>12000)clearPad();let dt=Math.min((t-last)/1000,.05);last=t;if(activeMixer)activeMixer.update(dt);let vx=0,vz=0;if(!$('#welcome').classList.contains('hidden')||$('#backdrop').classList.contains('open'))keys.clear();if(keys.has('left'))vx-=1;if(keys.has('right'))vx+=1;if(keys.has('up'))vz-=1;if(keys.has('down'))vz+=1;let mag=Math.hypot(vx,vz);if(activeMixer)setModelMotion(Boolean(mag));if(mag){vx/=mag;vz/=mag;let nx=avatar.position.x+vx*7.7*dt,nz=avatar.position.z+vz*7.7*dt;if(Math.hypot(nx,nz)<26){avatar.position.x=nx;avatar.position.z=nz}const targetAngle=Math.atan2(vx,vz);avatar.rotation.y+=Math.atan2(Math.sin(targetAngle-avatar.rotation.y),Math.cos(targetAngle-avatar.rotation.y))*Math.min(1,dt*10);walking+=dt*12;leftLeg.rotation.x=Math.sin(walking)*.65;rightLeg.rotation.x=-Math.sin(walking)*.65;leftArm.rotation.x=-Math.sin(walking)*.47;rightArm.rotation.x=Math.sin(walking)*.47;body.rotation.z=Math.sin(walking)*.035}else{leftLeg.rotation.x*=.83;rightLeg.rotation.x*=.83;leftArm.rotation.x*=.83;rightArm.rotation.x*=.83}body.rotation.z*=mag?1:.88;body.position.y=mag?Math.abs(Math.sin(walking))*.095:Math.sin(t*.002)*.05;if(activeModel){characterModelRoot.position.y=mag?Math.abs(Math.sin(walking))*.065:Math.sin(t*.0018)*.035;characterModelRoot.rotation.z=mag?Math.sin(walking)*.028:Math.sin(t*.0015)*.012;}head.rotation.z=Math.sin(t*.0017)*.045;hair.rotation.y=Math.sin(t*.0019)*.055;backpack.rotation.x=mag?Math.sin(walking)*.06:Math.sin(t*.001)*.02;let target=avatar.position.clone().add(new THREE.Vector3(0,12,18));camera.position.lerp(target,.055);camera.lookAt(avatar.position.x,2,avatar.position.z-1);starRing.rotation.y+=dt*.33;for(const fx of worldEffects){if(fx.kind==='orb')fx.g.position.y=fx.y+Math.sin(t*.0014+fx.i)*.23;else if(fx.kind==='lantern')fx.g.material.opacity=.11+.045*Math.sin(t*.002+fx.i);else fx.g.position.y=fx.y+Math.sin(t*.0004+fx.i)*.15}for(let i=0;i<clouds.length;i++)clouds[i].position.x+=dt*(.12+i%3*.05);near=null;let dist=5.7;for(let b of buildings){let d=Math.hypot(avatar.position.x-b.x,avatar.position.z-b.z);if(d<dist){near=b;dist=d}}if(near){$('#interact').innerText=near.icon+' '+near.name;$('#interact').style.opacity=1}else{$('#interact').innerText='✨ פעולה';$('#interact').style.opacity=.7}renderer.render(scene,camera)}camera.position.set(0,12,25);camera.lookAt(0,0,0);requestAnimationFrame(animate);$('#loading').classList.add('hidden');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script></body></html>
